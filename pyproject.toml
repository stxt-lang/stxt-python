[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stxt"
version = "0.8.1"
description = "STXT (Semantic Text) parser, schema/template validator and discovery resolver"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "stxt-lang" }]
keywords = ["stxt", "semantic text", "parser", "schema", "markup", "human-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://stxt.dev"
Repository = "https://github.com/stxt-lang/stxt-python"
Specification = "https://stxt.dev"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stxt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
